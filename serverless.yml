org: gberdejo
service: pre-token

plugins:
  - serverless-offline

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node24
    platform: node
    external:
      - '@aws-sdk/*'

custom:
  stage: ${opt:stage, 'dev'}
  env: ${file(config/${self:custom.stage}.yml)}
  lambdaName: pre-token

provider:
  name: aws
  runtime: nodejs24.x
  stage: ${self:custom.stage}
  environment: ${self:custom.env}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
          Resource:
            - arn:aws:dynamodb:*:*:table/tbl-users-${self:custom.stage}

functions: ${file(config/functions.yml)}

resources:
  Resources:
    PreTokenLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${self:custom.stage}-${self:custom.lambdaName}
        LogGroupClass: INFREQUENT_ACCESS
